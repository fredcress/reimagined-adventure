# Mealie recipe manager, a separate Dockge stack (e.g. stacks/mealie/compose.yaml).
# Docs: https://docs.mealie.io/documentation/getting-started/installation/sqlite/
# Default first login: changeme@example.com / MyPassword (change it straight away).
services:
  mealie:
    # Pin to a release from https://github.com/mealie-recipes/mealie/releases once it's running
    image: ghcr.io/mealie-recipes/mealie:latest
    container_name: mealie
    restart: unless-stopped
    ports:
      - "9925:9000"
    deploy:
      resources:
        limits:
          memory: 1000M
    volumes:
      - mealie-data:/app/data/
    environment:
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: Europe/London
      # The URL you'll open Mealie on (used in links/emails)
      BASE_URL: http://truenas.local:9925

volumes:
  mealie-data:
